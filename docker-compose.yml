name: anuvaad

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3002"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: anuvaad
      PGUSER: anuvaad
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Copy .env.example to .env and set NEO4J_PASSWORD}
      CLINICAL_NLP_URL: http://nlp:8000
      ANUVAAD_SQLITE_PATH: /data/anuvaad_health.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
      ANUVAAD_PROVIDER_ID: ${ANUVAAD_PROVIDER_ID:-anuvaad-demo}
      FHIR_BASE_URL: ${FHIR_BASE_URL:-}
      FHIR_CLIENT_ID: ${FHIR_CLIENT_ID:-}
      ANUVAAD_PUBLIC_URL: ${ANUVAAD_PUBLIC_URL:-http://localhost:3002}
    ports:
      - "${APP_PORT:-3002}:3002"
    volumes:
      - app_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nlp:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 90s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: anuvaad
      POSTGRES_USER: anuvaad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anuvaad -d anuvaad"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "NEO4J_PASS=\"$${NEO4J_AUTH#neo4j/}\"; cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$$NEO4J_PASS\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  nlp:
    build:
      context: ./clinical-nlp
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 300s

volumes:
  app_data:
  postgres_data:
  neo4j_data:
